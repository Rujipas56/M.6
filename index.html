<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แบบฟอร์มรับสมัคร (GitHub)</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; }
        .form-group { margin-bottom: 12px; }
        label { display: inline-block; width: 120px; }
        fieldset { margin: 15px 0; padding: 15px; }
    </style>
</head>
<body>

    <h2>สร้างฟอร์มรับสมัคร (GitHub Pages)</h2>
    <form action="result.html" method="GET" target="_blank">
        
        <div class="form-group">
            <label>1. ชื่อ:</label>
            <input type="text" name="firstname" required>
        </div>
        
        <div class="form-group">
            <label>2. นามสกุล:</label>
            <input type="text" name="lastname" required>
        </div>
        
        <fieldset>
            <legend>3. ที่อยู่</legend>
            <div class="form-group"><label>- เลขที่:</label> <input type="text" name="address_no"></div>
            <div class="form-group"><label>- ถนน:</label> <input type="text" name="street"></div>
            <div class="form-group"><label>- ซอย:</label> <input type="text" name="soi"></div>
            <div class="form-group"><label>- ตำบล:</label> <input type="text" name="sub_district"></div>
            <div class="form-group"><label>- อำเภอ:</label> <input type="text" name="district"></div>
            <div class="form-group"><label>- จังหวัด:</label> <input type="text" name="province"></div>
            <div class="form-group"><label>- รหัสไปรษณีย์:</label> <input type="text" name="zipcode"></div>
        </fieldset>
        
        <div class="form-group">
            <label>4. เบอร์โทรศัพท์:</label>
            <input type="tel" name="phone">
        </div>
        
        <div class="form-group">
            <label>5. E-mail:</label>
            <input type="email" name="email">
        </div>
        
        <div class="form-group">
            <label>6. Username:</label>
            <input type="text" name="username" required>
        </div>
        
        <div class="form-group">
            <label>7. Password:</label>
            <input type="password" name="password" required>
        </div>
        
        <button type="submit" style="padding: 10px 20px; background: #24292e; color: white; border: none; cursor: pointer;">สมัครสมาชิก</button>
    </form>

</body>
</html>
